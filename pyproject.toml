[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-tagger"
version = "0.1.0"
description = "CLI tool to calculate and write simple DJ energy scores for MP3 and FLAC files"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mathias" }
]
dependencies = [
  "numpy",
  "librosa",
  "mutagen"
]

[project.scripts]
energy-tagger = "energy_tagger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
